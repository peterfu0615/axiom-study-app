name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0-beta.1），留空则从 tag 推断'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build macOS bundle
    runs-on: macos-latest
    env:
      AXIOM_HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_MINISIGN_PUBLIC_KEY: RWSnvnNvFHYZt0pZpMpjyuEii96eLAFvxeK0P3nS34yrZFcIuhJzvCn4
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install pinned Typst renderer
        run: |
          cargo install typst-cli --version 0.14.2 --locked
          typst --version | grep '^typst 0\.14\.2'

      - name: Install updater signature verifier
        run: brew install minisign

      - name: Install dependencies
        run: npm ci

      - name: Require updater signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts."
            exit 1
          fi

      # ── 约束 #4：不假设 runner 架构，必须检测 arm64 ──
      - name: Detect runner architecture
        id: arch
        run: |
          raw=$(uname -m)
          echo "Detected runner architecture: $raw"
          # arch 输出映射为 Rust triple 风格，与 Tauri 产物命名
          # （Axiom_<v>_aarch64.dmg）及 updater.rs 的 std::env::consts::ARCH
          # （"aarch64" / "x86_64"）保持一致。
          case "$raw" in
            arm64) arch=aarch64; triple=aarch64-apple-darwin ;;
            x86_64) arch=x86_64; triple=x86_64-apple-darwin ;;
            *) echo "::error::Unsupported architecture: $raw"; exit 1 ;;
          esac
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "triple=$triple" >> "$GITHUB_OUTPUT"

      - name: Verify vision binary for detected architecture
        run: |
          triple="${{ steps.arch.outputs.triple }}"
          bin="src-tauri/binaries/axiom-vision-$triple"
          if [ ! -f "$bin" ]; then
            echo "::error::Missing vision binary: $bin"
            echo "arm64 runner 需要 binaries/axiom-vision-aarch64-apple-darwin"
            echo "x86_64 runner 需要 binaries/axiom-vision-x86_64-apple-darwin"
            exit 1
          fi
          echo "Found: $bin"

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # ── 签名公证（可选）──
      # 约束 #6：未签名 DMG 只能作为 Beta Release。
      # 当配置了 APPLE_* secrets 时执行签名 + 公证；否则产出未签名 Beta 包。
      - name: Setup signing (if configured)
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RUNNER_TEMP_PASSWORD: ${{ secrets.RUNNER_TEMP_PASSWORD }}
        # secrets 不能直接用于 if 条件；步骤 env 在条件求值前不可用，
        # 因此通过 job-level env 暴露布尔开关（见 jobs.build.env）。
        if: ${{ env.AXIOM_HAS_APPLE_CERTIFICATE == 'true' }}
        run: |
          echo "signing=enabled" >> "$GITHUB_OUTPUT"
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          # 导入证书到临时钥匙串
          cert_path="$RUNNER_TEMP/build.p12"
          keychain="$RUNNER_TEMP/build.keychain"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$cert_path"
          security create-keychain -p "$RUNNER_TEMP_PASSWORD" "$keychain" || true
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP_PASSWORD" "$keychain"
          security import "$cert_path" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "APPLE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build release bundle (signed)
        if: ${{ steps.signing.outputs.signing == 'enabled' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri -- build --target ${{ steps.arch.outputs.triple }}

      - name: Build release bundle (unsigned Beta)
        if: ${{ steps.signing.outputs.signing != 'enabled' }}
        run: |
          echo "::warning::No Developer ID configured. Producing an ad-hoc signed Beta build."
          echo "::warning::Ad-hoc signatures do not remove Gatekeeper approval requirements."
          # 在 Tauri 打包阶段完成 ad-hoc 签名，使 .app.zip 与 DMG 内的 app
          # 都具备完整的 CodeResources；不能等 DMG 生成后再补签名。
          APPLE_SIGNING_IDENTITY=- npm run tauri -- build --target ${{ steps.arch.outputs.triple }}

      - name: Finalize sandboxed sidecars and DMG
        run: |
          base="src-tauri/target/${{ steps.arch.outputs.triple }}/release/bundle"
          app="$base/macos/Axiom.app"
          dmg="$base/dmg/Axiom_${{ steps.version.outputs.version }}_${{ steps.arch.outputs.arch }}.dmg"
          bash scripts/finalize-macos-sidecars.sh "$PWD/$app" "$PWD/$dmg"

      - name: Verify macOS app bundle signature
        run: |
          app="src-tauri/target/${{ steps.arch.outputs.triple }}/release/bundle/macos/Axiom.app"
          if ! codesign --verify --deep --strict "$app"; then
            if [ "${{ steps.signing.outputs.signing }}" = "enabled" ]; then
              echo "::error::Developer ID signed app bundle did not pass codesign verification."
              exit 1
            fi
            echo "::warning::Repairing incomplete unsigned Beta bundle with ad-hoc signature."
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
          fi
          bash scripts/verify-macos-update-bundle.sh \
            "$PWD/$app" \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.arch.outputs.arch }}"

      - name: Repackage and sign final updater bundle
        id: updater
        run: |
          base="src-tauri/target/${{ steps.arch.outputs.triple }}/release/bundle/macos"
          archive_name="Axiom_${{ steps.version.outputs.version }}_${{ steps.arch.outputs.arch }}.app.tar.gz"
          archive="$GITHUB_WORKSPACE/app/$archive_name"
          rm -f "$archive" "$archive.sig"
          COPYFILE_DISABLE=1 /usr/bin/tar -czf "$archive" -C "$base" Axiom.app
          npm run tauri -- signer sign "$archive"
          test -s "$archive.sig"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "signature=$archive.sig" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Notarize (if signed)
        if: ${{ steps.signing.outputs.signing == 'enabled' }}
        run: |
          # 提交公证并 staple
          dmg="src-tauri/target/${{ steps.arch.outputs.triple }}/release/bundle/dmg/Axiom_${{ steps.version.outputs.version }}_${{ steps.arch.outputs.arch }}.dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - name: Resolve artifact paths
        id: artifacts
        run: |
          arch="${{ steps.arch.outputs.arch }}"
          triple="${{ steps.arch.outputs.triple }}"
          base="src-tauri/target/$triple/release/bundle"
          dmg="$base/dmg/Axiom_${{ steps.version.outputs.version }}_${arch}.dmg"
          app="$base/macos/Axiom.app"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "app_dir=$app" >> "$GITHUB_OUTPUT"

      - name: Zip .app (for auto-updater)
        run: |
          cd "$(dirname "${{ steps.artifacts.outputs.app_dir }}")"
          zip_name="Axiom_${{ steps.version.outputs.version }}_${{ steps.arch.outputs.arch }}.app.zip"
          zip -r -y "$GITHUB_WORKSPACE/app/$zip_name" Axiom.app

      - name: Generate SHA256 for .app.zip
        # 自动更新器校验下载完整性所需。
        run: |
          cd "$GITHUB_WORKSPACE/app"
          zip_name="Axiom_${{ steps.version.outputs.version }}_${{ steps.arch.outputs.arch }}.app.zip"
          shasum -a 256 "$zip_name" | awk '{print $1}' > "$zip_name.sha256"
          echo "SHA256: $(cat "$zip_name.sha256")"

      - name: Verify bridge and signed updater archives
        run: |
          verify_root="$(mktemp -d "$RUNNER_TEMP/axiom-update-verify.XXXXXX")"
          trap 'rm -rf "$verify_root"' EXIT
          zip_name="Axiom_${{ steps.version.outputs.version }}_${{ steps.arch.outputs.arch }}.app.zip"
          expected_sha="$(cat "$GITHUB_WORKSPACE/app/$zip_name.sha256")"
          actual_sha="$(shasum -a 256 "$GITHUB_WORKSPACE/app/$zip_name" | awk '{print $1}')"
          test "$expected_sha" = "$actual_sha"
          # Tauri 的 .sig/manifest signature 是 base64 包装的 minisign 文本；
          # minisign CLI 需要先还原成标准四行签名文件。
          base64 --decode -i "${{ steps.updater.outputs.signature }}" \
            -o "$verify_root/updater.minisig"
          minisign -Vm "${{ steps.updater.outputs.archive }}" \
            -x "$verify_root/updater.minisig" \
            -P "$UPDATER_MINISIGN_PUBLIC_KEY"
          cp "${{ steps.updater.outputs.archive }}" "$verify_root/tampered.app.tar.gz"
          printf 'tampered' >> "$verify_root/tampered.app.tar.gz"
          if minisign -Vm "$verify_root/tampered.app.tar.gz" \
            -x "$verify_root/updater.minisig" \
            -P "$UPDATER_MINISIGN_PUBLIC_KEY"; then
            echo "::error::Tampered updater archive unexpectedly passed signature verification."
            exit 1
          fi
          awk 'NR == 2 { first=substr($0, 1, 1); $0=(first == "A" ? "B" : "A") substr($0, 2) } { print }' \
            "$verify_root/updater.minisig" > "$verify_root/tampered.sig"
          if minisign -Vm "${{ steps.updater.outputs.archive }}" \
            -x "$verify_root/tampered.sig" \
            -P "$UPDATER_MINISIGN_PUBLIC_KEY"; then
            echo "::error::Tampered updater signature unexpectedly passed verification."
            exit 1
          fi
          mkdir "$verify_root/zip" "$verify_root/tar"
          ditto -x -k "$GITHUB_WORKSPACE/app/$zip_name" "$verify_root/zip"
          /usr/bin/tar -xzf "${{ steps.updater.outputs.archive }}" -C "$verify_root/tar"
          for extracted in "$verify_root/zip/Axiom.app" "$verify_root/tar/Axiom.app"; do
            bash scripts/verify-macos-update-bundle.sh \
              "$extracted" \
              "${{ steps.version.outputs.version }}" \
              "${{ steps.arch.outputs.arch }}"
          done

      - name: Generate signed updater manifest
        run: |
          node scripts/generate-updater-manifest.mjs \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.arch.outputs.arch }}" \
            "v${{ steps.version.outputs.version }}" \
            "${{ steps.updater.outputs.archive }}" \
            "${{ steps.updater.outputs.signature }}" \
            "$GITHUB_WORKSPACE/app/latest.json"
          node -e 'const m=require("./latest.json"); const p=m.platforms["darwin-${{ steps.arch.outputs.arch }}"]; if(m.version!=="${{ steps.version.outputs.version }}"||!p?.url||!p?.signature) process.exit(1)'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-${{ steps.version.outputs.version }}-${{ steps.arch.outputs.arch }}-dmg
          path: app/src-tauri/target/${{ steps.arch.outputs.triple }}/release/bundle/dmg/*.dmg

      - name: Upload bridge and signed updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-${{ steps.version.outputs.version }}-${{ steps.arch.outputs.arch }}-app
          path: |
            app/Axiom_*.app.zip
            app/Axiom_*.app.zip.sha256
            app/Axiom_*.app.tar.gz
            app/Axiom_*.app.tar.gz.sig
            app/latest.json

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version & pre-release flag
        id: meta
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Beta / pre-release 判定：版本号含 -beta / -rc / -alpha 等标记
          if [[ "$version" =~ -(beta|rc|alpha|dev) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Axiom ${{ steps.meta.outputs.version }}
          body: |
            ## Axiom ${{ steps.meta.outputs.version }}

            ### 安装说明

            1. 下载 `.dmg` 文件
            2. 打开 DMG，拖动 Axiom 到「应用程序」文件夹
            3. **首次打开**：右键点击 Axiom →「打开」→ 确认（Gatekeeper 拦截时需此操作）

            > ⚠️ **Beta Release**：无 Developer ID 时使用 ad-hoc 应用签名，macOS 仍会显示「无法验证开发者」提示。
            > 如需消除提示，可在终端执行：`xattr -dr com.apple.quarantine /Applications/Axiom.app`
            >
            > 正式版将使用 Apple Developer ID 签名 + 公证，届时双击即可打开。

            ### 架构
            - `aarch64`：Apple Silicon（M1/M2/M3/M4）
            - `x86_64`：Intel Mac

            请选择与你的 Mac 匹配的版本。
          files: |
            artifacts/*/*.dmg
            artifacts/*/*.app.zip
            artifacts/*/*.sha256
            artifacts/*/*.app.tar.gz
            artifacts/*/*.app.tar.gz.sig
            artifacts/*/latest.json
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
